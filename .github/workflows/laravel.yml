name: Laravel

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: '8.3'
      - uses: actions/checkout@v4
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Generate key
        run: php artisan key:generate
      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache
      - name: Create Database
        run: |
          echo -e "Enable LOAD DATA LOCAL INFILE in my.cnf\n"
          echo -e "SETTING secure-file-priv TO EMPTY STRING\n"
          echo -e "[mysqld]\nsecure-file-priv=''" | sudo tee -a /etc/mysql/my.cnf
          echo -e "SETTING local_infile TO ON\n"
          echo -e "[mysqld]\nlocal_infile='ON'" | sudo tee -a /etc/mysql/my.cnf
          echo -e "Start MYSQL service, it is off by default\n"
          sudo systemctl enable mysql.service
          sudo systemctl start mysql.service
          echo -e "[client]\nuser=root\npassword=root\nhost=127.0.0.1" > ~/.my.cnf
          echo -e "Creating Kali Database\n"
          mysql --defaults-file=~/.my.cnf -e 'CREATE DATABASE IF NOT EXISTS new_kali;'
          echo -e "Check new settings\n"
          mysql --defaults-file=~/.my.cnf -e "SELECT @@global.secure_file_priv, @@global.local_infile"
      - name: Redis Server in GitHub Actions
        uses: supercharge/redis-github-action@1.8.0
      - name: Execute pint
        run: composer pint
      - name: Execute tests
        env:
          DB_HOST: 127.0.0.1
        run: php artisan test
