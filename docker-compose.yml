services:
    app:
        container_name: app
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        working_dir: /var/www/
        volumes:
            - ./:/var/www
        networks:
            - app-study

    mysql:
        container_name: mysql
        platform: linux/x86_64
        image: mysql:latest
        restart: unless-stopped
        environment:
            - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
            - MYSQL_DATABASE=${DB_DATABASE}
            - MYSQL_USER=${DB_USERNAME}
            - MYSQL_PASSWORD=${DB_PASSWORD}
        ports:
            - '3399:3306'
        networks:
            - app-study

    nginx:
        container_name: nginx
        image: nginx:alpine
        volumes:
            - ./:/var/www
            - ./nginx/:/etc/nginx/conf.d/
        ports:
            - '8999:80'
        depends_on:
            - mysql
        networks:
            - app-study

    redis:
        image: redis:latest
        networks:
            - app-study

networks:
    app-study:
        driver: bridge
